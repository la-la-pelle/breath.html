<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>breathe</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:#080c12; font-family:'Georgia',serif; }
#wrap { position:relative; width:100vw; height:100vh; overflow:hidden; }
canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
#menu { position:absolute; top:max(22px, env(safe-area-inset-top, 22px)); left:24px; z-index:10; user-select:none; }
.menu-item { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:rgba(180,175,195,.38); cursor:pointer; padding:5px 0; transition:color .2s; line-height:1.9; }
.menu-item:hover,.menu-item:active { color:rgba(210,205,225,.7); }
.sub-items { display:none; padding-left:14px; }
.sub-items.open { display:block; }
.sub-item { font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:rgba(160,155,180,.32); cursor:pointer; padding:9px 0; min-height:44px; display:flex; align-items:center; transition:color .2s; line-height:1.9; }
.sub-item:hover,.sub-item:active { color:rgba(200,195,220,.68); }
.sub-item.selected { color:rgba(210,205,230,.65); }
.sub-item.selected::before { content:'· '; }
#phase-label { position:absolute; bottom:max(88px, calc(env(safe-area-inset-bottom,0px) + 88px)); left:0; width:100%; text-align:center; font-size:10px; letter-spacing:.5em; text-transform:uppercase; color:rgba(215,210,235,.55); pointer-events:none; transition:opacity .5s; }
#count-display { position:absolute; bottom:max(52px, calc(env(safe-area-inset-bottom,0px) + 52px)); left:0; width:100%; text-align:center; font-size:38px; color:rgba(225,220,240,.48); font-weight:200; pointer-events:none; letter-spacing:-.02em; }
#action-btn { position:absolute; bottom:max(22px, env(safe-area-inset-bottom,22px)); left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:rgba(185,180,205,.42); cursor:pointer; background:none; border:none; font-family:'Georgia',serif; padding:14px 32px; min-height:48px; min-width:80px; transition:color .3s; -webkit-appearance:none; white-space:nowrap; }
#action-btn:hover,#action-btn:active { color:rgba(220,215,238,.75); }
@media(max-width:480px){ .menu-item{font-size:10px;padding:8px 0;} .sub-item{padding:8px 0;} #count-display{font-size:32px;} #action-btn{font-size:10px;} }

/* Focus states for keyboard navigation */
.menu-item:focus, .sub-item:focus, #action-btn:focus {
  outline: 1px solid rgba(210,205,230,0.6);
  outline-offset: 3px;
  border-radius: 2px;
}
/* Landscape mobile: shrink organism space, push labels lower */
@media(max-height:500px) and (orientation:landscape){
  #phase-label { bottom: max(72px, calc(env(safe-area-inset-bottom,0px) + 72px)); font-size:9px; }
  #count-display { bottom: max(44px, calc(env(safe-area-inset-bottom,0px) + 44px)); font-size:28px; }
  #action-btn { bottom: max(12px, env(safe-area-inset-bottom,12px)); }
  #menu { top: max(12px, env(safe-area-inset-top,12px)); }
}
/* prefers-reduced-motion: pause all canvas animation, show static message */
@media(prefers-reduced-motion:reduce){
  #reduced-motion-msg { display:flex !important; }
  #wrap canvas { display:none; }
  #menu, #phase-label, #count-display, #action-btn { display:none; }
}
</style>
</head>
<body>
<div id="wrap">
  <!-- Reduced motion fallback -->
  <div id="reduced-motion-msg" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;flex-direction:column;align-items:center;justify-content:center;color:rgba(210,205,230,0.7);text-align:center;padding:40px;gap:20px;">
    <div style="font-size:13px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:8px;">breathe</div>
    <div style="font-size:11px;letter-spacing:.2em;line-height:2.2;opacity:.7;">inhale · 4 counts<br>hold · 4 counts<br>exhale · 4 counts<br>hold · 4 counts</div>
    <div style="font-size:10px;opacity:.45;letter-spacing:.15em;margin-top:16px;">animations paused for reduced motion</div>
  </div>
  <canvas id="c" role="img" aria-label="Breathing visualization — follow the animation to guide your breath"></canvas>
  <div id="menu">
    <div class="menu-item" id="lbl-aesthetic" role="button" aria-expanded="false" tabindex="0" aria-controls="sub-aesthetic">aesthetic</div>
    <div class="sub-items" id="sub-aesthetic">
      <div class="sub-item selected" data-ae="0" role="menuitem" tabindex="0">aurora</div>
      <div class="sub-item" tabindex="0" role="menuitem" data-ae="1">sonic</div>
      <div class="sub-item" tabindex="0" role="menuitem" data-ae="2">geo</div>
      <div class="sub-item" tabindex="0" role="menuitem" data-ae="3">frond</div>
    
      <div class="sub-item" tabindex="0" role="menuitem" data-ae="4">tide</div>
    </div>
    <div class="menu-item" id="lbl-timing" role="button" aria-expanded="false" tabindex="0" aria-controls="sub-timing">timing</div>
    <div class="sub-items" id="sub-timing">
      <div class="sub-item selected" data-t="4">4 · 4 · 4 · 4</div>
      <div class="sub-item" tabindex="0" role="menuitem" data-t="6">6 · 6 · 6 · 6</div>
      <div class="sub-item" tabindex="0" role="menuitem" data-t="8">8 · 8 · 8 · 8</div>
    </div>
  </div>
  <div id="phase-label"></div>
  <div id="count-display"></div>
  <button id="action-btn" aria-label="Begin breathing exercise">begin</button>
</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
// Guard: silently clamp negative radii to prevent IndexSizeError across all arc calls
const _arc=ctx.arc.bind(ctx);
ctx.arc=function(x,y,r,start,end,ccw){_arc(x,y,Math.max(0,r),start,end,ccw);};
let W,H,cx,cy,R;
let aesthetic=0,timeSec=4,soundOn=false,audioCtx=null;
const SCALE_MIN=0.55,SCALE_MAX=1.85;
function easeInOutSine(t){return -(Math.cos(Math.PI*t)-1)/2;}
function easeInCubic(t){return t*t*t;}
function easeOutCubic(t){return 1-Math.pow(1-t,3);}
// Exhale: smoothstep — controlled, consistent
function easeExhale(t){return t<0.5?2*t*t:-1+(4-2*t)*t;}
// Inhale: activates immediately, builds — 40% linear + 60% cubic
function easeInhale(t){return 0.4*t+0.6*t*t*t;}

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  cx=W/2;cy=H/2;
  // Clamp R so organism never clips text on tiny screens
  const baseR=W<360?0.24:W<480?0.28:0.26;
  R=Math.min(W,H)*baseR;
  // Cap R to available vertical space, but never go below 40px
  const safeH=Math.max(0,H-160);
  if(safeH>0) R=Math.min(R,safeH*0.42);
  R=Math.max(40,R);
  rebuildScene();
}

// scene data
let auroraOrbs=[],filaments=[],bokeh=[],petals=[],pearls=[],fibers=[];

function rebuildScene(){
  // AURORA
  const aC=[{h:270,s:55,l:65},{h:280,s:45,l:72},{h:255,s:50,l:70},{h:195,s:40,l:75},{h:290,s:35,l:80},{h:240,s:30,l:82},{h:310,s:40,l:68},{h:185,s:45,l:70}];
  auroraOrbs=aC.map((c,i)=>({
    angle:(i/aC.length)*Math.PI*2+Math.random()*.4,
    baseR:.18+Math.random()*.28,driftSpeed:.06+Math.random()*.08,
    driftPhase:Math.random()*Math.PI*2,driftAmp:.04+Math.random()*.06,
    h:c.h,s:c.s,l:c.l,size:.32+Math.random()*.28,
    alpha:.55+Math.random()*.3,pulsePhase:Math.random()*Math.PI*2
  }));

  // ORB (merged filament+orb) — arms with pearl clusters
  filaments=Array.from({length:34},(_,i)=>({
    baseAngle:(i/28)*Math.PI*2,
    jitter:(Math.random()-.5)*.15,
    len:.48+Math.random()*.48,
    wavAmp:.04+Math.random()*.08,
    wavFreq:1.0+Math.random()*2.0,
    wavPhase:Math.random()*Math.PI*2,
    hue:175+Math.random()*85,
    // pearls along arm: more dense, varying sizes
    pearls:Array.from({length:6},(_,j)=>({
      t:.10+(j/5)*.80,
      size: j===0?5+Math.random()*12 : j<3?2.5+Math.random()*8:1+Math.random()*5,
      phase:Math.random()*Math.PI*2,
      hue:188+Math.random()*80,
      warmTint:Math.random()>.55
    }))
  }));
  petals=Array.from({length:8},(_,i)=>({
    angle:(i/8)*Math.PI*2+Math.random()*.25,
    len:.5+Math.random()*.38,width:.16+Math.random()*.13,
    hue:175+Math.random()*75,phase:Math.random()*Math.PI*2
  }));
  // Phyllotaxis core cluster — golden angle placement
  const PHI=137.5077*(Math.PI/180); // golden angle in radians
  pearls=Array.from({length:90},(_,n)=>{
    const r=Math.sqrt(n/90)*0.36; // normalized radius
    const angle=n*PHI;
    return{
      n, ring:r, angle,
      // Lissajous params per pearl — slowly varying ratios
      lisA:1+Math.floor(n/30), // 1,2,3 — varies by group
      lisB:2+Math.floor(n/45), // 2,3
      lisPhase:n*0.4,
      lisAmp:(2+Math.random()*5), // micro-motion amplitude in px
      size:1.5+Math.random()*11*(1-r*0.6), // bigger near center
      phase:Math.random()*Math.PI*2,
      hue:190+Math.random()*60,
      warmTint:Math.random()>.6,speed:.18+Math.random()*.3
    };
  });

  // FIBER
  // MEMBRANE — layered folded sweeps
  fibers=Array.from({length:42},(_,i)=>{
    const layer=Math.floor(i/6); // 7 layers of 6 folds
    const foldIdx=i%6;
    return{
      layer, foldIdx,
      // Each fold has a base angle and curvature
      baseAngle: (foldIdx/6)*Math.PI*1.4 - Math.PI*0.7 + (Math.random()-.5)*0.3,
      arcSweep: (0.4+Math.random()*0.5)*(foldIdx%2===0?1:-1), // alternating curve direction
      arcHeight: 0.3+Math.random()*0.5,
      layerDepth: layer/7, // 0=outer, 1=inner
      phase: Math.random()*Math.PI*2,
      speed: 0.08+Math.random()*0.12,
      // Color: warm amber at inner layers, cool iridescent at outer
      hue: 25+layer*25, // inner=amber(25), outer=teal/iridescent(175)
      alpha: 0.12+layer*0.04,
      iridShift: Math.random()*60,
      edgeGlitter: Array.from({length:8},()=>({
        t:Math.random(), phase:Math.random()*Math.PI*2,
        hue:Math.random()*360, size:0.5+Math.random()*2.5
      }))
    };
  });

  bokeh=Array.from({length:65},()=>({
    x:Math.random(),y:Math.random(),r:3+Math.random()*18,
    a:.028+Math.random()*.085,hue:160+Math.random()*130,
    phase:Math.random()*Math.PI*2,speed:.18+Math.random()*.38
  }));
}

// breathing state
let breathScale=SCALE_MIN,breathPhase='idle',phaseProg=0,phaseTime=4;
let undT=0; // undulation clock, never resets
let geoHue=40; // smoothed geometric hue, cross-fades between phases
let membraneBloomSeed=0; // changes each inhale cycle to reposition folds
let lastPhaseForSeed=0;  // tracks phase changes for seed update
let smoothBreathT=0; // lerped breathT — no snapping on phase transitions
let flashIntensity=0;  // 0-1, decays each frame, triggered at key transitions
let lastPhaseIdx=-1;   // tracks phase changes to trigger flash
let scaleAtPhaseStart=SCALE_MIN;
let running=false,paused=false,currentPhaseIdx=0;
let speedMult=1,elapsed=0,lastTime=performance.now();
let btnState='begin';

const phaseEl=document.getElementById('phase-label');
const countEl=document.getElementById('count-display');
const actionBtn=document.getElementById('action-btn');

function setBtn(s){btnState=s;actionBtn.textContent=s;}

function playTone(freq,dur,atk,dec){
  if(!soundOn||!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.frequency.value=freq;o.type='sine';
  const t=audioCtx.currentTime;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+atk);
  g.gain.linearRampToValueAtTime(0,t+dur-dec);o.start(t);o.stop(t+dur);
}

function startPhase(idx){
  currentPhaseIdx=idx%4;
  breathPhase=['inhale','hold','exhale','hold'][currentPhaseIdx];
  phaseProg=0;phaseTime=timeSec;
  // Seed from ACTUAL current scale — eliminates jump at all transitions
  scaleAtPhaseStart=breathScale;
  if(currentPhaseIdx===0)     {speedMult=1;playTone(396,.9,.25,.3);}
  else if(currentPhaseIdx===2){speedMult=1;playTone(264,.9,.1,.4);}
  else if(currentPhaseIdx===1){speedMult=0.12;}
  else                        {speedMult=0.12;}
  // New inhale = new membrane bloom position
  if(currentPhaseIdx===0){ membraneBloomSeed=Math.random()*1000; }
  phaseEl.style.opacity='0';
  setTimeout(()=>{phaseEl.textContent=breathPhase;phaseEl.style.opacity='1';},180);
}

function getBreathScale(){
  // Always interpolate FROM where we actually were when phase started
  // This is what eliminates the jump — no assumption about starting position
  if(currentPhaseIdx===0){
    // Inhale: from wherever we are → SCALE_MAX
    return scaleAtPhaseStart+(SCALE_MAX-scaleAtPhaseStart)*easeInhale(phaseProg);
  }
  if(currentPhaseIdx===2){
    // Exhale: from wherever we are → SCALE_MIN
    return scaleAtPhaseStart+(SCALE_MIN-scaleAtPhaseStart)*easeExhale(phaseProg);
  }
  // Holds: stay at start scale (no jump, because start = actual scale at transition)
  return scaleAtPhaseStart;
}

function resetAll(){
  running=false;paused=false;
  breathPhase='idle';breathScale=SCALE_MIN;
  phaseProg=0;speedMult=1;
  phaseEl.style.opacity='0';
  setTimeout(()=>{phaseEl.textContent='';},300);
  countEl.textContent='';setBtn('begin');
}

// ── TINGLE ───────────────────────────────────────────────────
function drawAuroraTingle(time){
  // Radial ripples — always running, speed never changes
  for(let i=0;i<5;i++){
    const offset=(i/5)*Math.PI*2;
    const t=((undT*0.28+offset)%(Math.PI*2))/(Math.PI*2);
    const r=t*Math.min(W,H)*0.40;
    const a=(1-t)*0.07;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(200,185,255,${a})`;ctx.lineWidth=1.1;ctx.stroke();
  }
}

function drawAuroraShimmer(time, breathT){
  // On hold: loose shimmer — orb edges dance
  const shimmerAmt = (breathPhase==='hold') ? 1.0 : 0.3;
  for(let i=0;i<12;i++){
    const a=(i/12)*Math.PI*2+undT*0.12;
    const S=Math.min(W,H);
    const baseDist=S*(0.15+breathT*0.35);
    const wobble=Math.sin(undT*1.8+i*0.9)*S*0.04*shimmerAmt;
    const px=cx+Math.cos(a)*(baseDist+wobble);
    const py=cy+Math.sin(a)*(baseDist+wobble);
    const pulse=Math.sin(undT*2.5+i*0.7)*0.5+0.5;
    ctx.beginPath();ctx.arc(px,py,1.5+pulse*4*shimmerAmt,0,Math.PI*2);
    const h=250+i*12+undT*8;
    ctx.fillStyle=`hsla(${h},75%,88%,${(0.08+pulse*0.18)*shimmerAmt+0.04})`;ctx.fill();
  }
}
// wave aesthetic scene data — interference rings
let waveRings=[];
function rebuildWaveRings(){
  waveRings=Array.from({length:7},(_,i)=>({
    baseFreq:0.28+i*0.09,      // each ring oscillates at slightly different frequency
    phase:i*(Math.PI*2/7),     // evenly distributed phases
    hue:185+i*18,              // cool blue-teal-lavender palette
    amp:0.06+i*0.012,          // outer rings have more amplitude variation
    speed:0.55+i*0.08,         // drift speed
    offsetX:(Math.random()-0.5)*0.12, // slight center offset per ring
    offsetY:(Math.random()-0.5)*0.12,
  }));
}
rebuildWaveRings();

function drawWave(scale,time){
  const breathT=smoothBreathT;
  const S=Math.min(W,H);

  // Single sonar system — clean, calm, centered
  // On inhale: rings expand outward, spacing grows, glow brightens
  // On exhale: rings converge, spacing tightens, glow dims
  // On hold: rings drift at constant slow pace, no size change

  const isInhaleHold=(currentPhaseIdx===1);
  const isExhaleHold=(currentPhaseIdx===3);

  // Number of rings — fixed, not changing. Simplicity.
  const NUM_RINGS=8;
  // Base radius scales with breath
  const baseRadius=S*(0.06+breathT*0.32);
  // Ring spacing also scales — inhale = more spread
  const spacing=S*(0.025+breathT*0.038);
  // Slow drift speed — constant, never stops
  const drift=undT*0.22;

  // Slow rotation per ring on hold — keeps life without busy-ness
  const holdRotate=(currentPhaseIdx===1||currentPhaseIdx===3)?undT*0.015:0;

  for(let i=0;i<NUM_RINGS;i++){
    const r=baseRadius+(i*spacing);
    if(r>S*0.56||r<1||!isFinite(r)) continue;

    // Opacity: innermost ring strongest, fade outward
    const falloff=1-(i/NUM_RINGS)*0.65;
    const alpha=(0.12+breathT*0.22)*falloff;
    const pulse=Math.sin(undT*0.35+i*0.7)*0.028*(isInhaleHold||isExhaleHold?1.6:0.8);

    const hue=188+i*6; // cool teal to soft blue-violet
    // lineW uses smoothBreathT so it eases down at exhale start, no snap
    const lineW=(1.2+smoothBreathT*1.6)*(1-i/NUM_RINGS*0.45);

    // Outer glow pass
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle=`hsla(${hue},62%,72%,${(alpha+pulse)*0.28})`;
    ctx.lineWidth=lineW*5.5; ctx.stroke();
    // Core ring
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle=`hsla(${hue+12},75%,88%,${alpha+pulse})`;
    ctx.lineWidth=lineW; ctx.stroke();
  }

  // Central glow — expands on inhale-hold
  const coreBoost=isInhaleHold?1.55:1.0;
  const coreR=S*(0.022+breathT*0.065)*coreBoost;
  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,coreR*3.2);
  cg.addColorStop(0,`rgba(210,238,255,${0.62+breathT*0.28})`);
  cg.addColorStop(0.3,`rgba(155,210,238,${0.28+breathT*0.22})`);
  cg.addColorStop(0.7,`rgba(95,172,215,${0.08+breathT*0.10})`);
  cg.addColorStop(1,'transparent');
  ctx.beginPath(); ctx.arc(cx,cy,coreR*3.2,0,Math.PI*2);
  ctx.fillStyle=cg; ctx.fill();

  // Tiny center dot
  ctx.beginPath(); ctx.arc(cx,cy,2.5,0,Math.PI*2);
  ctx.fillStyle=`rgba(220,242,255,${0.7+breathT*0.25})`; ctx.fill();
  // Transition flash: a single bright sonar pulse ring
  if(flashIntensity>0.01){
    const fr=S*(0.04+(1-flashIntensity)*0.48);
    ctx.beginPath();ctx.arc(cx,cy,fr,0,Math.PI*2);
    ctx.strokeStyle=`rgba(190,228,255,${flashIntensity*0.7})`;
    ctx.lineWidth=2.5+flashIntensity*4; ctx.stroke();
    // Outer diffuse
    ctx.beginPath();ctx.arc(cx,cy,fr+6,0,Math.PI*2);
    ctx.strokeStyle=`rgba(170,215,248,${flashIntensity*0.28})`;
    ctx.lineWidth=8; ctx.stroke();
  }
}


// ── AURORA DRAW ───────────────────────────────────────────────
function getAuroraRock(time){
  if(currentPhaseIdx!==1) return {rx:0,ry:0};
  const rx=Math.sin(undT*0.18)*0.018+Math.sin(undT*0.11)*0.009;
  const ry=Math.cos(undT*0.14)*0.014+Math.cos(undT*0.09)*0.007;
  return {rx,ry};
}

function drawAurora(scale,time){
  const S=Math.min(W,H);
  const breathT=smoothBreathT;
  ctx.fillStyle='rgba(10,7,18,0.52)';ctx.fillRect(0,0,W,H);

  const loops=[
    {scl:0.36+breathT*0.24, rot:undT*0.048,  alpha:0.55+breathT*0.12, spawnAt:0.0},
    {scl:0.60+breathT*0.32, rot:-undT*0.028, alpha:0.38+breathT*0.18, spawnAt:0.18},
    {scl:0.85+breathT*0.40, rot:undT*0.015,  alpha:0.18+breathT*0.20, spawnAt:0.45},
  ];
  loops.forEach((loop,li)=>{
    const loopVis=Math.max(0,Math.min(1,(breathT-loop.spawnAt)/0.40));
    if(loopVis<=0.01) return;
    const rock=getAuroraRock(undT);
    auroraOrbs.forEach((orb)=>{
      const driftAngle=orb.angle+loop.rot+Math.sin(undT*orb.driftSpeed+orb.driftPhase+li)*orb.driftAmp;
      const dist=orb.baseR*loop.scl*S;
      const px=cx+Math.cos(driftAngle)*dist+rock.rx*S;
      const py=cy+Math.sin(driftAngle)*dist+rock.ry*S;
      // Inhale: activates with a surge then settles at hold size
      // Hold: orbs stay big/bright
      // Exhale: dims progressively
      const inhaleActivation=(currentPhaseIdx===0&&phaseProg<0.25)
        ?(1+Math.sin(phaseProg/0.25*Math.PI)*0.18):1.0; // brief surge on activation
      const inhaleHoldBoost=(currentPhaseIdx===1)?1.28:1.0;
      const exhaleAlphaMult=(currentPhaseIdx===2)?(1.0-smoothBreathT*0.38):1.0;
      const sizeBoost=inhaleHoldBoost*inhaleActivation;
      const bloomSize=Math.max(0.1,orb.size*S*(0.30+loop.scl*0.50)*loopVis*sizeBoost);
      const alpha=(orb.alpha*loop.alpha+Math.sin(undT*0.38+orb.pulsePhase+li)*0.04)*loopVis*sizeBoost*exhaleAlphaMult;
      const g=ctx.createRadialGradient(px-bloomSize*.12,py-bloomSize*.1,bloomSize*.02,px,py,bloomSize);
      g.addColorStop(0,`hsla(${orb.h+li*6},${orb.s}%,${orb.l+8}%,${Math.min(alpha,.85)})`);
      g.addColorStop(0.4,`hsla(${orb.h+10},${orb.s-5}%,${orb.l}%,${alpha*0.52})`);
      g.addColorStop(1,'transparent');
      ctx.beginPath();ctx.arc(px,py,bloomSize,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    });
  });
  const coreSize=S*(0.10+breathT*0.16);
  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,coreSize);
  cg.addColorStop(0,`rgba(240,235,255,${0.08+breathT*0.14})`);
  cg.addColorStop(0.5,`rgba(200,185,240,${0.04+breathT*0.07})`);
  cg.addColorStop(1,'transparent');
  ctx.beginPath();ctx.arc(cx,cy,coreSize,0,Math.PI*2);ctx.fillStyle=cg;ctx.fill();
  drawAuroraShimmer(time, breathT);
  drawAuroraTingle(time);
  // Transition flash: expanding ring of light
  if(flashIntensity>0.01){
    const fr=Math.min(W,H)*(0.05+(1-flashIntensity)*0.55);
    const fg=ctx.createRadialGradient(cx,cy,fr*0.6,cx,cy,fr);
    fg.addColorStop(0,`rgba(220,210,255,0)`);
    fg.addColorStop(0.5,`rgba(230,218,255,${flashIntensity*0.32})`);
    fg.addColorStop(1,`rgba(210,195,255,0)`);
    ctx.beginPath();ctx.arc(cx,cy,fr,0,Math.PI*2);
    ctx.fillStyle=fg;ctx.fill();
  }
}

// ── GEOMETRIC: Flower of Life overlapping circles ─────────────
let hueBase=40;
function drawGeometric(scale,time){
  const breathT=smoothBreathT;
  const S=Math.min(W,H);
  const isHoldPhase=(currentPhaseIdx===1||currentPhaseIdx===3);
  const holdPulse=isHoldPhase?Math.sin(undT*0.5)*0.014:0;
  const baseR=R*(scale+holdPulse);

  // Smooth warm hue — cross-fades between phases, never snaps
  const targetHue=currentPhaseIdx===0?52+breathT*10:currentPhaseIdx===1?46:currentPhaseIdx===2?36-breathT*12:22;
  hueBase+=(targetHue-hueBase)*0.022;
  const glow=0.50+breathT*0.50;

  // Rotation — continuous, slow, never stops; slightly faster on movement phases
  const baseSpeed=0.005;
  const breathBoost=breathT*0.008;
  const rotA=undT*(baseSpeed+breathBoost);
  const rotB=-undT*(baseSpeed*0.72+breathBoost*0.7);
  // Rotation slows on hold but never stops — continuous subtle twist
  const holdSlow=isHoldPhase?0.42:1.0;

  function glowLine(alpha,hue,width){
    ctx.strokeStyle=`hsla(${hue},78%,62%,${alpha*0.42})`;ctx.lineWidth=width*8;ctx.stroke();
    ctx.strokeStyle=`hsla(${hue+8},85%,80%,${alpha*0.78})`;ctx.lineWidth=width*2.5;ctx.stroke();
    ctx.strokeStyle=`hsla(${hue+18},92%,95%,${Math.min(alpha*1.2,1)})`;ctx.lineWidth=width*0.6;ctx.stroke();
  }

  // ── Flower of Life: center circle + 6 petals (vesica piscis) ──
  // This is the core motif from references 4 and 5
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rotA*holdSlow);
  const petalR=baseR*0.42;

  // Outer boundary circle
  ctx.beginPath();ctx.arc(0,0,petalR*2.38,0,Math.PI*2);
  glowLine(0.14*glow,hueBase,0.7);

  // Mid ring
  ctx.beginPath();ctx.arc(0,0,petalR*1.72,0,Math.PI*2);
  glowLine(0.12*glow,hueBase+8,0.6);

  // Center circle
  ctx.beginPath();ctx.arc(0,0,petalR,0,Math.PI*2);
  glowLine(0.18*glow,hueBase+4,0.7);

  // 6 petal circles — each offset by petalR from center
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2;
    ctx.beginPath();ctx.arc(Math.cos(a)*petalR,Math.sin(a)*petalR,petalR,0,Math.PI*2);
    glowLine((0.15+i*0.008)*glow,hueBase+i*6,0.65);
  }
  ctx.restore();

  // ── Second ring of 6 — rotated offset, counter-rotate ──
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rotB*holdSlow+Math.PI/6);
  const petalR2=baseR*0.55;
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2;
    ctx.beginPath();ctx.arc(Math.cos(a)*petalR2*0.58,Math.sin(a)*petalR2*0.58,petalR2*0.58,0,Math.PI*2);
    glowLine(0.10*glow,hueBase+12+i*5,0.55);
  }
  // Outer ring of 12 small circles
  for(let i=0;i<12;i++){
    const a=(i/12)*Math.PI*2;
    ctx.beginPath();ctx.arc(Math.cos(a)*petalR2*1.15,Math.sin(a)*petalR2*1.15,petalR2*0.28,0,Math.PI*2);
    glowLine(0.09*glow,hueBase+i*4,0.5);
  }
  ctx.restore();

  // ── Phyllotaxis field — warm gold dots, gradual with breath ──
  const PHI_GEO=137.5077*(Math.PI/180);
  const maxPts=100;
  const phylloSpread=baseR*(0.16+smoothBreathT*0.65);
  for(let n=0;n<maxPts;n++){
    const pointVis=n<40?1.0:Math.max(0,Math.min(1,(smoothBreathT-(n-40)/80*0.85)/0.15));
    if(pointVis<=0.01) continue;
    const r=Math.sqrt(n/maxPts)*phylloSpread;
    const angle=n*PHI_GEO+rotA*holdSlow;
    const px=cx+Math.cos(angle)*r, py=cy+Math.sin(angle)*r;
    const lt=undT*1.1+n*0.3;
    const pulse=Math.sin(undT*2.0+n*0.4)*.5+.5;
    ctx.beginPath();ctx.arc(px+Math.sin(2*lt)*1.8,py+Math.sin(3*lt+Math.PI*0.5)*1.8,0.4+pulse*1.5,0,Math.PI*2);
    ctx.fillStyle=`hsla(${hueBase+(n*1.8)%28},85%,80%,${(0.08+pulse*0.28)*glow*pointVis})`;ctx.fill();
  }

  // Central warm glow
  // Center glow expands dramatically on inhale and inhale-hold
  const coreExpand=0.08+smoothBreathT*0.28; // 0.08 on exhale-hold → 0.36 on inhale-hold
  const coreAlpha=0.6+smoothBreathT*0.38;
  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,baseR*coreExpand*1.8);
  cg.addColorStop(0,`rgba(255,250,210,${coreAlpha})`);
  cg.addColorStop(0.25,`hsla(${hueBase+5},92%,88%,${coreAlpha*0.75})`);
  cg.addColorStop(0.6,`hsla(${hueBase},82%,65%,${coreAlpha*0.35})`);
  cg.addColorStop(1,'transparent');
  ctx.beginPath();ctx.arc(cx,cy,baseR*coreExpand*1.8,0,Math.PI*2);ctx.fillStyle=cg;ctx.fill();
  // Sharp center dot — flashes on transition
  const geoFlashBoost=1+flashIntensity*2.2;
  ctx.beginPath();ctx.arc(cx,cy,baseR*(0.022+flashIntensity*0.06),0,Math.PI*2);
  ctx.fillStyle=`rgba(255,252,220,${Math.min(0.95,(0.9+smoothBreathT*0.1)*geoFlashBoost)})`;ctx.fill();
  // Flash: center glow expands to meet first inner circle (petalR = baseR*0.42)
  // At flashIntensity=1: radius = coreExpand*1.8 (tiny)
  // At flashIntensity=0: radius = baseR*0.42 (exactly the first ring)
  if(flashIntensity>0.01){
    const targetR=baseR*0.42; // exactly the first Flower of Life circle
    const fr=baseR*coreExpand*1.8+(targetR-baseR*coreExpand*1.8)*(1-flashIntensity);
    const fg=ctx.createRadialGradient(cx,cy,fr*0.3,cx,cy,fr);
    fg.addColorStop(0,`hsla(${hueBase+5},95%,98%,${flashIntensity*0.65})`);
    fg.addColorStop(0.55,`hsla(${hueBase+12},88%,86%,${flashIntensity*0.32})`);
    fg.addColorStop(1,`hsla(${hueBase+18},80%,75%,0)`);
    ctx.beginPath();ctx.arc(cx,cy,fr,0,Math.PI*2);
    ctx.fillStyle=fg;ctx.fill();
    // Bright ring at the wavefront — hits exactly the inner circle boundary
    ctx.beginPath();ctx.arc(cx,cy,fr,0,Math.PI*2);
    ctx.strokeStyle=`hsla(${hueBase+8},92%,96%,${flashIntensity*0.55})`;
    ctx.lineWidth=1.2+flashIntensity*2.5;ctx.stroke();
  }
}

// ── MEMBRANE: mirrored symmetric bloom, free-float drift ──────
// Two symmetrical clusters share a central spine
// Free-float drift: slow Lissajous of the whole form center
let membraneDriftX=0, membraneDriftY=0; // current drift
let membraneDriftTargetX=0, membraneDriftTargetY=0; // target
function updateMembraneDrift(S){
  // Slow Lissajous drift of the form center — tight radius
  const driftR=S*0.09;
  membraneDriftTargetX=Math.sin(undT*0.12)*driftR+Math.sin(undT*0.07)*driftR*0.4;
  membraneDriftTargetY=Math.cos(undT*0.09)*driftR+Math.cos(undT*0.05)*driftR*0.5;
  // Lerp toward target — very slow, always moving
  membraneDriftX+=(membraneDriftTargetX-membraneDriftX)*0.008;
  membraneDriftY+=(membraneDriftTargetY-membraneDriftY)*0.008;
}

function drawMembraneSide(spineX,spineY,S,breathT,mirror){
  const formRotation=undT*0.008;
  const STEPS=28;

  fibers.forEach(f=>{
    const idleT=undT*f.speed*0.32+f.phase;
    const seaweedWiggle=Math.sin(idleT*0.72+f.foldIdx*0.6)*0.14*(0.4+f.layerDepth)
                       +Math.sin(idleT*1.35+f.foldIdx*1.1)*0.055*(0.3+f.layerDepth);
    const spreadMult=0.20+smoothBreathT*1.45+seaweedWiggle;
    const bloomAngle=f.baseAngle*mirror+formRotation
      +Math.sin(idleT*0.38)*0.10
      +Math.sin(idleT*0.65+f.foldIdx)*0.05;
    const petalBreath=1+Math.sin(undT*0.6+f.phase*1.4)*0.06*(1+f.layerDepth*0.5);
    const exhaleDrag=(currentPhaseIdx===2)
      ?Math.sin(phaseProg*Math.PI*1.8+f.layerDepth*Math.PI*0.6)*0.08*(1-phaseProg)*f.layerDepth:0;
    const foldLen=S*(0.22+f.layerDepth*0.28)*(spreadMult+exhaleDrag)*petalBreath;
    const iridT=1-f.layerDepth;
    const shimmer=Math.sin(undT*0.5+f.iridShift)*0.5+0.5;
    const foldVis=Math.max(0.04,Math.min(1,
      f.layerDepth<0.25?1.0:0.04+smoothBreathT*(1.05-f.layerDepth*0.75)));

    // Tentacle traveling wave — wave travels from root to tip over time
    const pts=[];
    const wideArr=[];
    for(let s=0;s<=STEPS;s++){
      const t=s/STEPS;
      // Traveling wave: phase offset by t so wave propagates along length
      const travelPhase=t*Math.PI*3.2;
      const waveSpeed=undT*2.0+f.phase;
      const waveAmp=t*t*foldLen*0.38*(0.5+f.layerDepth*0.6);
      const lateral=Math.sin(waveSpeed-travelPhase)*waveAmp
                   +Math.sin(waveSpeed*0.55-travelPhase*0.65+f.phase)*waveAmp*0.35;
      const ax=spineX+Math.cos(bloomAngle)*t*foldLen;
      const ay=spineY+Math.sin(bloomAngle)*t*foldLen*mirror;
      pts.push({x:ax+Math.cos(bloomAngle+Math.PI/2)*lateral,
                y:ay+Math.sin(bloomAngle+Math.PI/2)*lateral*mirror});
      wideArr.push(Math.max(0.3,(1-t*0.72)*S*(0.022+f.layerDepth*0.018)*spreadMult*foldVis));
    }

    // Tapered colored stroke
    for(let s=0;s<STEPS;s++){
      const t=s/STEPS;
      const p=pts[s],q=pts[s+1];
      const w=(wideArr[s]+wideArr[s+1])*0.5;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);
      const hue=f.layerDepth<0.4?25+f.layerDepth*40+t*25:185+iridT*60+shimmer*28+t*20;
      const alpha=f.layerDepth<0.4?(0.55-t*0.2)*foldVis:(0.45+iridT*0.25-t*0.15)*foldVis;
      ctx.strokeStyle=`hsla(${hue},65%,${60+t*30}%,${alpha})`;
      ctx.lineWidth=w;ctx.stroke();
    }
    // Soft glow pass
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
    for(let s=1;s<=STEPS;s++) ctx.lineTo(pts[s].x,pts[s].y);
    ctx.strokeStyle=`hsla(${f.layerDepth<0.4?35:185+iridT*55},60%,75%,${0.08*foldVis})`;
    ctx.lineWidth=wideArr[0]*3.5;ctx.lineJoin='round';ctx.stroke();

    // Glitter dots along tentacle
    f.edgeGlitter.forEach(g=>{
      const gpulse=Math.sin(undT*2.3+g.phase)*.5+.5;
      const shimMult=(currentPhaseIdx===1)?1.7:0.9;
      if(gpulse>0.25&&foldVis>0.1){
        const pt=pts[Math.min(Math.floor(g.t*STEPS),STEPS-1)];
        ctx.beginPath();ctx.arc(pt.x,pt.y,g.size*(0.4+gpulse)*shimMult,0,Math.PI*2);
        ctx.fillStyle=`hsla(${g.hue+undT*16},86%,92%,${(gpulse-0.25)*0.8*iridT*shimMult})`;ctx.fill();
      }
    });
  });
}

// ── FROND: mirrored bezier bloom (ae===3) ─────────────────────
function drawFrondSide(spineX,spineY,S,breathT,mirror){
  const formRotation=undT*0.008;
  fibers.forEach(f=>{
    const idleT=undT*f.speed*0.22+f.phase;
    const lisA=2+smoothBreathT*0.45;
    const lisB=1+smoothBreathT*0.22;
    const lisX=Math.sin(lisA*(idleT*0.6))*0.12;
    const lisY=Math.sin(lisB*(idleT*0.6)+f.phase)*0.08;
    const seaweedWiggle=Math.sin(idleT*0.72+f.foldIdx*0.6)*0.14*(0.4+f.layerDepth)
                       +Math.sin(idleT*1.35+f.foldIdx*1.1)*0.055*(0.3+f.layerDepth);
    const spreadMult=0.20+smoothBreathT*1.45+seaweedWiggle+lisX*0.65;
    const bloomAngle=f.baseAngle*mirror+formRotation
      +Math.sin(idleT*0.42)*0.12+lisY*0.55
      +Math.sin(idleT*0.75+f.foldIdx)*0.06;
    const petalBreath=1+Math.sin(undT*0.6+f.phase*1.4)*0.06*(1+f.layerDepth*0.5);
    const exhaleDrag=(currentPhaseIdx===2)
      ?Math.sin(phaseProg*Math.PI*1.8+f.layerDepth*Math.PI*0.6)*0.08*(1-phaseProg)*f.layerDepth:0;
    const foldW=S*(0.17+f.layerDepth*0.24)*(spreadMult+exhaleDrag)*petalBreath;
    const foldH=S*(0.12+f.arcHeight*0.28)*(spreadMult+exhaleDrag*0.7)*petalBreath;
    const sweep=f.arcSweep*(0.65+Math.sin(idleT*0.45+lisX*0.3)*0.20);
    const iridT=1-f.layerDepth;
    const shimmer=Math.sin(undT*0.5+f.iridShift)*0.5+0.5;
    const foldVis=Math.max(0.04,Math.min(1,
      f.layerDepth<0.25?1.0:0.04+smoothBreathT*(1.05-f.layerDepth*0.75)));

    const perpAngle=bloomAngle+Math.PI/2;
    const foldLen=Math.sqrt(foldW*foldW+foldH*foldH);
    const wave1=Math.sin(idleT*1.1+f.foldIdx*0.8+f.phase)*0.55;
    const wave2=Math.sin(idleT*0.82+f.foldIdx*1.3+f.phase+1.6)*0.40;
    const bend1=wave1*foldLen*0.38;
    const bend2=wave2*foldLen*0.30;

    const x0=spineX,y0=spineY;
    const cp1x=x0+Math.cos(bloomAngle-sweep)*foldW*0.5+Math.cos(perpAngle)*bend1;
    const cp1y=y0+Math.sin(bloomAngle-sweep)*foldH*0.5*mirror+Math.sin(perpAngle)*bend1*mirror;
    const cp2x=x0+Math.cos(bloomAngle)*foldW*0.88+Math.cos(perpAngle)*(foldH*0.28-bend2);
    const cp2y=y0+Math.sin(bloomAngle)*foldH*0.88*mirror+Math.sin(perpAngle)*(foldH*0.28-bend2)*mirror;
    const ex=x0+Math.cos(bloomAngle+sweep*0.55)*foldW;
    const ey=y0+Math.sin(bloomAngle+sweep*0.55)*foldH*0.82*mirror;

    const nx=Math.cos(bloomAngle+Math.PI/2)*S*0.05*spreadMult;
    const ny=Math.sin(bloomAngle+Math.PI/2)*S*0.05*spreadMult*mirror;
    const fillG=ctx.createLinearGradient(x0,y0,ex,ey);
    if(f.layerDepth<0.4){
      fillG.addColorStop(0,`hsla(${25+f.layerDepth*40},65%,38%,${f.alpha*1.1*foldVis})`);
      fillG.addColorStop(0.5,`hsla(${35+f.layerDepth*28},55%,55%,${f.alpha*0.85*foldVis})`);
      fillG.addColorStop(1,`hsla(50,45%,70%,${f.alpha*0.25*foldVis})`);
    } else {
      const h=185+iridT*60+shimmer*28;
      fillG.addColorStop(0,`hsla(${h},44%,54%,${f.alpha*0.85*foldVis})`);
      fillG.addColorStop(0.4,`hsla(${h+18},48%,74%,${f.alpha*1.0*foldVis})`);
      fillG.addColorStop(0.75,`hsla(${h+38},58%,86%,${f.alpha*0.75*foldVis})`);
      fillG.addColorStop(1,`hsla(${h+55},68%,93%,${f.alpha*0.18*foldVis})`);
    }
    ctx.beginPath();
    ctx.moveTo(x0+nx,y0+ny);
    ctx.bezierCurveTo(cp1x+nx,cp1y+ny,cp2x+nx,cp2y+ny,ex+nx,ey+ny);
    ctx.bezierCurveTo(cp2x-nx,cp2y-ny,cp1x-nx,cp1y-ny,x0-nx,y0-ny);
    ctx.closePath();
    ctx.fillStyle=fillG;ctx.fill();
    const edgeH=iridT*175+shimmer*75+162;
    ctx.beginPath();ctx.moveTo(x0,y0);
    ctx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,ex,ey);
    ctx.strokeStyle=`hsla(${edgeH},72%,86%,${(0.09+iridT*0.18+shimmer*0.09)*foldVis})`;
    ctx.lineWidth=0.7+iridT*1.0;ctx.stroke();
    f.edgeGlitter.forEach(g=>{
      const gpulse=Math.sin(undT*2.3+g.phase)*.5+.5;
      const shimMult=(currentPhaseIdx===1)?1.7:0.9;
      if(gpulse>0.25){
        const bx=cubicBezier(x0,cp1x,cp2x,ex,g.t);
        const by=cubicBezier(y0,cp1y,cp2y,ey,g.t)*mirror+(y0*(1-mirror));
        ctx.beginPath();ctx.arc(bx,by,g.size*(0.4+gpulse)*shimMult,0,Math.PI*2);
        ctx.fillStyle=`hsla(${g.hue+undT*16},86%,92%,${(gpulse-0.25)*0.8*iridT*shimMult})`;ctx.fill();
      }
    });
  });
}

function drawFrond(scale,time){
  const breathT=smoothBreathT;
  const S=Math.min(W,H);
  updateMembraneDrift(S);
  const formCx=cx+membraneDriftX, formCy=cy+membraneDriftY;
  const coreR=S*(0.05+breathT*0.09);
  const bg=ctx.createRadialGradient(formCx,formCy,0,formCx,formCy,coreR*2.8);
  bg.addColorStop(0,`rgba(255,220,140,${0.30+breathT*0.22})`);
  bg.addColorStop(0.4,`rgba(220,150,60,${0.12+breathT*0.12})`);
  bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(formCx,formCy,coreR*2.8,0,Math.PI*2);ctx.fill();
  drawFrondSide(formCx,formCy,S,breathT,1);
  drawFrondSide(formCx,formCy,S,breathT,-1);
  const spineMult=((currentPhaseIdx===1)?1.7:1.0)*(1+flashIntensity*2.0);
  for(let i=0;i<16;i++){
    const a=(i/16)*Math.PI*2+undT*0.20;
    const dist=(2.5+Math.sin(undT*2.0+i)*3.5)*(scale*0.5+0.5);
    const pulse=Math.sin(undT*2.8+i*0.7)*.5+.5;
    ctx.beginPath();ctx.arc(formCx+Math.cos(a)*dist,formCy+Math.sin(a)*dist,0.5+pulse*2.2*spineMult,0,Math.PI*2);
    ctx.fillStyle=`hsla(${30+i*14+undT*20},88%,92%,${(0.22+pulse*0.60)*spineMult})`;ctx.fill();
  }
  if(flashIntensity>0.01){
    const fr=Math.min(W,H)*(0.03+(1-flashIntensity)*0.35);
    for(let i=0;i<12;i++){
      const a=(i/12)*Math.PI*2+undT*0.3;
      ctx.beginPath();ctx.arc(formCx+Math.cos(a)*fr,formCy+Math.sin(a)*fr,1.5+flashIntensity*4,0,Math.PI*2);
      ctx.fillStyle=`hsla(${180+i*15},85%,92%,${flashIntensity*0.85})`;ctx.fill();
    }
  }
}


function drawMembrane(scale,time){
  const breathT=smoothBreathT;
  const S=Math.min(W,H);
  updateMembraneDrift(S);

  // Form center drifts slowly — always moving, tight radius
  const formCx=cx+membraneDriftX;
  const formCy=cy+membraneDriftY;

  // Warm core glow at center spine
  const coreR=S*(0.05+breathT*0.09);
  const bg=ctx.createRadialGradient(formCx,formCy,0,formCx,formCy,coreR*2.8);
  bg.addColorStop(0,`rgba(255,220,140,${0.30+breathT*0.22})`);
  bg.addColorStop(0.4,`rgba(220,150,60,${0.12+breathT*0.12})`);
  bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(formCx,formCy,coreR*2.8,0,Math.PI*2);ctx.fill();

  // Draw both sides — mirrored on Y axis through the spine point
  // Side A: fans right/up
  drawMembraneSide(formCx,formCy,S,breathT,1);
  // Side B: mirror on Y — abstract lungs
  drawMembraneSide(formCx,formCy,S,breathT,-1);

  // Spine center glitter
  const spineMult=((currentPhaseIdx===1)?1.7:1.0)*(1+flashIntensity*2.0);
  for(let i=0;i<16;i++){
    const a=(i/16)*Math.PI*2+undT*0.20;
    const dist=(2.5+Math.sin(undT*2.0+i)*3.5)*(scale*0.5+0.5);
    const pulse=Math.sin(undT*2.8+i*0.7)*.5+.5;
    ctx.beginPath();ctx.arc(formCx+Math.cos(a)*dist,formCy+Math.sin(a)*dist,0.5+pulse*2.2*spineMult,0,Math.PI*2);
    ctx.fillStyle=`hsla(${30+i*14+undT*20},88%,92%,${(0.22+pulse*0.60)*spineMult})`;ctx.fill();
  }
  // Flash: expanding ring of iridescent orbs from spine center
  if(flashIntensity>0.01){
    const fr=Math.min(W,H)*(0.03+(1-flashIntensity)*0.35);
    for(let i=0;i<12;i++){
      const a=(i/12)*Math.PI*2+undT*0.3;
      ctx.beginPath();ctx.arc(formCx+Math.cos(a)*fr,formCy+Math.sin(a)*fr,1.5+flashIntensity*4,0,Math.PI*2);
      ctx.fillStyle=`hsla(${180+i*15},85%,92%,${flashIntensity*0.85})`;ctx.fill();
    }
  }
}

function cubicBezier(p0,p1,p2,p3,t){
  const mt=1-t;
  return mt*mt*mt*p0+3*mt*mt*t*p1+3*mt*t*t*p2+t*t*t*p3;
}


function drawCore(scale,time,warm){
  const cr=Math.max(1,16*scale),pulse=1+Math.sin(time*1.7)*.07,h=warm?34:198;
  [[R*.44*scale,`hsla(${h},58%,84%,.05)`],[R*.24*scale,`hsla(${h},64%,90%,.09)`],[cr*2.6*pulse,`hsla(${h},78%,95%,.2)`]].forEach(([r,col])=>{
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,col);g.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  });
  const cg=ctx.createRadialGradient(cx-cr*.28,cy-cr*.28,1,cx,cy,cr*pulse);
  if(warm){cg.addColorStop(0,'rgba(255,244,210,.98)');cg.addColorStop(.3,'rgba(244,202,142,.87)');cg.addColorStop(.7,'rgba(198,155,92,.42)');cg.addColorStop(1,'transparent');}
  else{cg.addColorStop(0,'rgba(255,253,255,.98)');cg.addColorStop(.3,'rgba(218,233,247,.85)');cg.addColorStop(.7,'rgba(178,208,233,.42)');cg.addColorStop(1,'transparent');}
  ctx.beginPath();ctx.arc(cx,cy,cr*pulse,0,Math.PI*2);ctx.fillStyle=cg;ctx.fill();
  for(let i=0;i<6;i++){
    const ga=(i/6)*Math.PI*2+time*.45,gr=(2+Math.random()*5)*scale;
    ctx.beginPath();ctx.arc(cx+Math.cos(ga)*gr,cy+Math.sin(ga)*gr,.5+Math.random(),0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${.42+Math.random()*.4})`;ctx.fill();
  }
}

function drawArc(){
  if(!running)return;
  const arcR=Math.max(1,R*1.22);
  ctx.beginPath();ctx.arc(cx,cy,arcR,0,Math.PI*2);
  ctx.strokeStyle='rgba(200,195,220,.07)';ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,arcR,-Math.PI/2,-Math.PI/2+phaseProg*Math.PI*2);
  const h=currentPhaseIdx===0?192:currentPhaseIdx===2?218:205;
  ctx.strokeStyle=`hsla(${h},60%,84%,.28)`;ctx.lineWidth=1;ctx.stroke();
}

// ── LOOP ─────────────────────────────────────────────────────
function frame(now){
  requestAnimationFrame(frame);
  const rawDt=Math.min((now-lastTime)/1000,.05);
  lastTime=now;
  if(!paused){ elapsed+=rawDt; undT+=rawDt; }
  // Smooth breathT — lerps at speed that tracks breath but won't snap on phase change
  const rawBreathT=(breathScale-SCALE_MIN)/(SCALE_MAX-SCALE_MIN);
  // Slower lerp = more organic carry-through at phase boundaries
  // On inhale→hold (idx 1) and exhale→hold (idx 3), coast gently
  const isTransitionHold=(currentPhaseIdx===1||currentPhaseIdx===3)&&phaseProg<0.15;
  const lerpSpeed=isTransitionHold?1.8:3.2; // slower on entry to hold = momentum carry
  smoothBreathT+=(rawBreathT-smoothBreathT)*Math.min(rawDt*lerpSpeed,1);
  smoothBreathT=Math.max(0,Math.min(1,smoothBreathT)); // clamp to [0,1]
  if(running&&!paused){
    phaseProg+=rawDt/phaseTime;
    if(phaseProg>=1){phaseProg=1;startPhase(currentPhaseIdx+1);}
    countEl.textContent=Math.max(1,Math.ceil(phaseTime*(1-phaseProg)));
  }
  // Flash on inhale→hold (0→1) and hold→exhale (1→2)
  if(currentPhaseIdx!==lastPhaseIdx){
    if((lastPhaseIdx===0&&currentPhaseIdx===1)||(lastPhaseIdx===1&&currentPhaseIdx===2)){
      flashIntensity=1.0;
    }
    lastPhaseIdx=currentPhaseIdx;
  }
  // Decay flash — fast decay so it's a flash not a linger
  flashIntensity=Math.max(0,flashIntensity-rawDt*4.5);
  breathScale=getBreathScale();

  if(aesthetic===0){
    drawAurora(breathScale,elapsed);
    if(running){
      const arcR=Math.min(W,H)*.46;
      ctx.beginPath();ctx.arc(cx,cy,arcR,0,Math.PI*2);
      ctx.strokeStyle='rgba(200,195,230,.05)';ctx.lineWidth=1;ctx.stroke();
      ctx.beginPath();ctx.arc(cx,cy,arcR,-Math.PI/2,-Math.PI/2+phaseProg*Math.PI*2);
      ctx.strokeStyle='rgba(220,210,245,.16)';ctx.lineWidth=1;ctx.stroke();
    }
  } else {
    ctx.fillStyle=aesthetic===2?'rgba(12,7,2,.92)':aesthetic===3?'rgba(8,12,16,.92)':aesthetic===4?'rgba(6,12,16,.92)':aesthetic===1?'rgba(2,8,16,.92)':'rgba(7,11,20,.9)';
    ctx.fillRect(0,0,W,H);
    if(aesthetic===1){
      drawWave(breathScale,elapsed);
      drawArc();
    } else if(aesthetic===2){
      drawGeometric(breathScale,elapsed);
      drawArc();
    } else if(aesthetic===3){
      drawFrond(breathScale,elapsed);
      drawArc();
    } else {
      drawMembrane(breathScale,elapsed);
      drawArc();
    }
  }
}

function drawBokeh(time){
  bokeh.forEach(b=>{
    const pulse=1+Math.sin(time*b.speed+b.phase)*.28;
    const bx=cx+(b.x-.5)*W*1.5,by=cy+(b.y-.5)*H*1.5,br=b.r*pulse;
    const g=ctx.createRadialGradient(bx,by,0,bx,by,br);
    g.addColorStop(0,`hsla(${b.hue},65%,88%,${b.a*1.3})`);
    g.addColorStop(.45,`hsla(${b.hue+25},55%,84%,${b.a*.45})`);
    g.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  });
}

requestAnimationFrame(frame);

// ── CONTROLS ─────────────────────────────────────────────────
function toggleSub(id){
  ['sub-aesthetic','sub-timing'].forEach(s=>{
    if(s!==id){
      document.getElementById(s).classList.remove('open');
      const lbl=document.querySelector(`[aria-controls="${s}"]`);
      if(lbl) lbl.setAttribute('aria-expanded','false');
    }
  });
  const el=document.getElementById(id);
  el.classList.toggle('open');
  const lbl=document.querySelector(`[aria-controls="${id}"]`);
  if(lbl) lbl.setAttribute('aria-expanded',el.classList.contains('open')?'true':'false');
}
document.getElementById('lbl-aesthetic').addEventListener('click',()=>toggleSub('sub-aesthetic'));
document.getElementById('lbl-aesthetic').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleSub('sub-aesthetic');}});
document.getElementById('lbl-timing').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleSub('sub-timing');}});
document.getElementById('lbl-timing').addEventListener('click',()=>toggleSub('sub-timing'));
document.querySelectorAll('[data-ae]').forEach(el=>{
  el.addEventListener('click',()=>{
    aesthetic=parseInt(el.dataset.ae);
    document.querySelectorAll('[data-ae]').forEach(e=>e.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('sub-aesthetic').classList.remove('open');
  });
});
document.querySelectorAll('[data-t]').forEach(el=>{
  el.addEventListener('click',()=>{
    timeSec=parseInt(el.dataset.t);
    document.querySelectorAll('[data-t]').forEach(e=>e.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('sub-timing').classList.remove('open');
  });
});

let pressTimer=null;
actionBtn.addEventListener('mousedown',()=>{if(btnState!=='begin')pressTimer=setTimeout(()=>{resetAll();},700);});
actionBtn.addEventListener('touchstart',()=>{if(btnState!=='begin')pressTimer=setTimeout(()=>{resetAll();},700);},{passive:true});
function clearPress(){if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}}
actionBtn.addEventListener('mouseup',clearPress);
actionBtn.addEventListener('touchend',clearPress,{passive:true});
actionBtn.addEventListener('click',()=>{
  if(btnState==='begin'){
    running=true;startPhase(0);setBtn('pause');
  }else if(btnState==='pause'){
    paused=true;setBtn('resume');
  }else if(btnState==='resume'){
    paused=false;setBtn('pause');
  }
});
canvas.addEventListener('click',()=>{
  document.getElementById('sub-aesthetic').classList.remove('open');
  document.getElementById('sub-timing').classList.remove('open');
});

resize();
window.addEventListener('resize',resize);
</script>
