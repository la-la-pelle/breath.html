<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>breathe</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:#080c12; font-family:'Georgia',serif; }
#wrap { position:relative; width:100vw; height:100vh; overflow:hidden; }
canvas { position:absolute; top:0; left:0; width:100%; height:100%; }

#menu { position:absolute; top:max(22px, env(safe-area-inset-top, 22px)); left:24px; z-index:10; user-select:none; }
.menu-item { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:rgba(180,175,195,.38); cursor:pointer; padding:5px 0; transition:color .2s; line-height:1.9; }
.menu-item:hover,.menu-item:active { color:rgba(210,205,225,.7); }
.sub-items { display:none; padding-left:14px; }
.sub-items.open { display:block; }
.sub-item { font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:rgba(160,155,180,.32); cursor:pointer; padding:5px 0; transition:color .2s; line-height:1.9; }
.sub-item:hover,.sub-item:active { color:rgba(200,195,220,.68); }
.sub-item.selected { color:rgba(210,205,230,.65); }
.sub-item.selected::before { content:'· '; }

/* Phase label — lower third, clear of organism */
#phase-label {
  position:absolute;
  bottom:max(88px, calc(env(safe-area-inset-bottom, 0px) + 88px));
  left:0; width:100%; text-align:center;
  font-size:10px; letter-spacing:.5em; text-transform:uppercase;
  color:rgba(210,205,230,.3); pointer-events:none;
  transition:opacity .5s;
}
#count-display {
  position:absolute;
  bottom:max(52px, calc(env(safe-area-inset-bottom, 0px) + 52px));
  left:0; width:100%; text-align:center;
  font-size:38px; color:rgba(225,220,240,.18);
  font-weight:200; pointer-events:none; letter-spacing:-.02em;
}

/* Single centered action button */
#action-btn {
  position:absolute;
  bottom:max(22px, env(safe-area-inset-bottom, 22px));
  left:50%; transform:translateX(-50%);
  font-size:11px; letter-spacing:.28em; text-transform:uppercase;
  color:rgba(185,180,205,.42); cursor:pointer; background:none; border:none;
  font-family:'Georgia',serif; padding:14px 32px;
  transition:color .3s, opacity .3s; -webkit-appearance:none;
  white-space:nowrap;
}
#action-btn:hover,#action-btn:active { color:rgba(220,215,238,.75); }

@media(max-width:480px){
  .menu-item{font-size:10px;padding:6px 0;}
  .sub-item{padding:6px 0;}
  #count-display{font-size:32px;}
  #action-btn{font-size:10px;}
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="menu">
    <div class="menu-item" id="lbl-aesthetic">aesthetic</div>
    <div class="sub-items" id="sub-aesthetic">
      <div class="sub-item selected" data-ae="0">aurora</div>
      <div class="sub-item" data-ae="1">orb</div>
      <div class="sub-item" data-ae="2">filament</div>
      <div class="sub-item" data-ae="3">fiber</div>
    </div>
    <div class="menu-item" id="lbl-timing">timing</div>
    <div class="sub-items" id="sub-timing">
      <div class="sub-item selected" data-t="4">4 · 4 · 4 · 4</div>
      <div class="sub-item" data-t="6">6 · 6 · 6 · 6</div>
      <div class="sub-item" data-t="8">8 · 8 · 8 · 8</div>
    </div>
    <div class="menu-item" id="lbl-sound">sound &nbsp;<span id="sound-state">off</span></div>
  </div>

  <div id="phase-label"></div>
  <div id="count-display"></div>
  <button id="action-btn">begin</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, R;
let aesthetic=0, timeSec=4, soundOn=false, audioCtx=null;

const SCALE_MIN=0.55, SCALE_MAX=1.52;
function easeInOutSine(t){ return -(Math.cos(Math.PI*t)-1)/2; }

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  cx=W/2; cy=H/2;
  R=Math.min(W,H)*(W<480?0.28:0.26);
  rebuildScene();
}

let auroraOrbs=[], filaments=[], bokeh=[], petals=[], fibers=[], pearls=[];

function rebuildScene(){
  const aC=[
    {h:270,s:55,l:65},{h:280,s:45,l:72},{h:255,s:50,l:70},
    {h:195,s:40,l:75},{h:290,s:35,l:80},{h:240,s:30,l:82},
    {h:310,s:40,l:68},{h:185,s:45,l:70},
  ];
  auroraOrbs=aC.map((c,i)=>({
    angle:(i/aC.length)*Math.PI*2+Math.random()*.4,
    baseR:.18+Math.random()*.28,
    driftSpeed:.06+Math.random()*.08,
    driftPhase:Math.random()*Math.PI*2,
    driftAmp:.04+Math.random()*.06,
    h:c.h,s:c.s,l:c.l,
    size:.32+Math.random()*.28,
    alpha:.55+Math.random()*.3,
    pulsePhase:Math.random()*Math.PI*2,
  }));

  filaments=Array.from({length:32},(_,i)=>({
    baseAngle:(i/32)*Math.PI*2,
    jitter:(Math.random()-.5)*.2,
    len:.5+Math.random()*.5,
    wavAmp:.05+Math.random()*.09,
    wavFreq:1.2+Math.random()*2.2,
    wavPhase:Math.random()*Math.PI*2,
    hue:170+Math.random()*90,
    orbs:Array.from({length:4},(_,j)=>({
      t:.15+(j/3)*.7,size:2.5+Math.random()*8,
      phase:Math.random()*Math.PI*2,hue:165+Math.random()*100
    }))
  }));
  petals=Array.from({length:8},(_,i)=>({
    angle:(i/8)*Math.PI*2+Math.random()*.25,
    len:.5+Math.random()*.38,width:.16+Math.random()*.13,
    hue:175+Math.random()*75,phase:Math.random()*Math.PI*2
  }));

  pearls=Array.from({length:200},()=>{
    const r=Math.random();
    const ring=r<.4?Math.random()*.28:r<.75?.28+Math.random()*.32:.6+Math.random()*.42;
    return{ring,angle:Math.random()*Math.PI*2,
      size:ring<.3?2+Math.random()*16:ring<.6?1.5+Math.random()*9:.8+Math.random()*5,
      phase:Math.random()*Math.PI*2,hue:190+Math.random()*60,
      warmTint:Math.random()>.6,speed:.15+Math.random()*.35};
  });

  fibers=Array.from({length:280},()=>{
    const angle=Math.random()*Math.PI*2;
    const warm=Math.abs(Math.cos(angle+.4))>.35;
    return{angle,warm,len:.4+Math.random()*.7,
      wavAmp:(Math.random()-.5)*.13,wavFreq:.7+Math.random()*2.8,
      wavPhase:Math.random()*Math.PI*2,
      hue:warm?25+Math.random()*25:190+Math.random()*38,
      sat:warm?48+Math.random()*28:16+Math.random()*24,
      alpha:.06+Math.random()*.26,width:.3+Math.random()*1.5,
      phase:Math.random()*Math.PI*2};
  }).sort((a,b)=>a.warm-b.warm);

  bokeh=Array.from({length:65},()=>({
    x:Math.random(),y:Math.random(),r:3+Math.random()*18,
    a:.028+Math.random()*.085,hue:160+Math.random()*130,
    phase:Math.random()*Math.PI*2,speed:.18+Math.random()*.38
  }));
}

// ── STATE ────────────────────────────────────────────────────
let breathScale=SCALE_MIN,breathPhase='idle',phaseProg=0,phaseTime=4;
let scaleAtPhaseStart=SCALE_MIN;
let running=false,paused=false,currentPhaseIdx=0;
let speedMult=1,elapsed=0,lastTime=performance.now();

// btn states: 'begin' | 'pause' | 'resume'
let btnState='begin';

const phaseEl=document.getElementById('phase-label');
const countEl=document.getElementById('count-display');
const actionBtn=document.getElementById('action-btn');

function setBtn(state){
  btnState=state;
  actionBtn.textContent=state;
}

function playTone(freq,dur,atk,dec){
  if(!soundOn||!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.frequency.value=freq;o.type='sine';
  const t=audioCtx.currentTime;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+atk);
  g.gain.linearRampToValueAtTime(0,t+dur-dec);o.start(t);o.stop(t+dur);
}

function startPhase(idx){
  currentPhaseIdx=idx%4;
  // Clean phase names — just 'hold' for both holds
  const phaseNames=['inhale','hold','exhale','hold'];
  breathPhase=phaseNames[currentPhaseIdx];
  phaseProg=0; phaseTime=timeSec;

  if(currentPhaseIdx===0)     {scaleAtPhaseStart=SCALE_MIN;speedMult=1;playTone(396,.9,.25,.3);}
  else if(currentPhaseIdx===2){scaleAtPhaseStart=SCALE_MAX;speedMult=1;playTone(264,.9,.1,.4);}
  else if(currentPhaseIdx===1){scaleAtPhaseStart=SCALE_MAX;speedMult=0.12;}
  else                        {scaleAtPhaseStart=SCALE_MIN;speedMult=0.12;}

  // Set label cleanly — clear first, then set after short delay to avoid bleed
  phaseEl.style.opacity='0';
  setTimeout(()=>{
    phaseEl.textContent=breathPhase;
    phaseEl.style.opacity='1';
  },180);
}

function getBreathScale(){
  if(currentPhaseIdx===0) return SCALE_MIN+(SCALE_MAX-SCALE_MIN)*easeInOutSine(phaseProg);
  if(currentPhaseIdx===2) return SCALE_MAX+(SCALE_MIN-SCALE_MAX)*easeInOutSine(phaseProg);
  return scaleAtPhaseStart+Math.sin(elapsed*1.1)*0.007;
}

function resetAll(){
  running=false;paused=false;
  breathPhase='idle';breathScale=SCALE_MIN;
  phaseProg=0;speedMult=1;
  phaseEl.style.opacity='0';
  setTimeout(()=>{phaseEl.textContent='';},300);
  countEl.textContent='';
  setBtn('begin');
}

// ── TINGLE SYSTEMS ───────────────────────────────────────────
function drawAuroraTingle(time){
  for(let i=0;i<4;i++){
    const offset=(i/4)*Math.PI*2;
    const t=((time*0.32+offset)%(Math.PI*2))/(Math.PI*2);
    const r=t*Math.min(W,H)*0.36;
    const a=(1-t)*0.055;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(200,185,255,${a})`;ctx.lineWidth=1;ctx.stroke();
  }
}

function drawOrbTingle(scale,time){
  for(let i=0;i<18;i++){
    const a=(i/18)*Math.PI*2+time*0.38;
    const dist=(4+Math.sin(time*2.2+i*1.3)*3)*scale;
    const px=cx+Math.cos(a)*dist,py=cy+Math.sin(a)*dist;
    const pulse=Math.sin(time*3+i*0.7)*.5+.5;
    ctx.beginPath();ctx.arc(px,py,0.8+pulse*2.2,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${0.22+pulse*0.52})`;ctx.fill();
  }
  for(let i=0;i<10;i++){
    const a=(i/10)*Math.PI*2+time*0.16;
    const dist=(10+Math.sin(time*1.5+i)*4)*scale;
    const px=cx+Math.cos(a)*dist,py=cy+Math.sin(a)*dist;
    const pulse=Math.sin(time*2.5+i*0.9)*.5+.5;
    ctx.beginPath();ctx.arc(px,py,0.6+pulse*1.4,0,Math.PI*2);
    ctx.fillStyle=`rgba(200,220,255,${0.18+pulse*0.32})`;ctx.fill();
  }
}

function drawFilamentTingle(scale,time){
  for(let i=0;i<20;i++){
    const a=(i/20)*Math.PI*2;
    const dist=(3+Math.sin(time*2.8+i*1.1)*2.5)*scale;
    const px=cx+Math.cos(a)*dist,py=cy+Math.sin(a)*dist;
    const pulse=Math.sin(time*3.5+i*0.8)*.5+.5;
    ctx.beginPath();ctx.arc(px,py,0.5+pulse*1.8,0,Math.PI*2);
    ctx.fillStyle=`hsla(${190+i*8},80%,90%,${0.18+pulse*0.45})`;ctx.fill();
  }
}

function drawFiberTingle(scale,time){
  for(let i=0;i<22;i++){
    const a=(i/22)*Math.PI*2+time*0.14;
    const dist=(3+Math.sin(time*2+i*1.4)*3)*scale;
    const px=cx+Math.cos(a)*dist,py=cy+Math.sin(a)*dist;
    const pulse=Math.sin(time*2.8+i*0.6)*.5+.5;
    const warm=i%3!==0;
    ctx.beginPath();ctx.arc(px,py,0.7+pulse*2,0,Math.PI*2);
    ctx.fillStyle=warm?`rgba(255,200,120,${0.2+pulse*0.48})`:`rgba(180,220,240,${0.16+pulse*0.35})`;
    ctx.fill();
  }
}

// ── DRAW AESTHETICS ──────────────────────────────────────────
function drawAurora(scale,time){
  const S=Math.min(W,H);
  const breathT=(scale-SCALE_MIN)/(SCALE_MAX-SCALE_MIN);
  ctx.fillStyle='rgba(10,7,18,0.52)';ctx.fillRect(0,0,W,H);
  auroraOrbs.forEach(orb=>{
    const driftAngle=orb.angle+Math.sin(time*orb.driftSpeed+orb.driftPhase)*orb.driftAmp;
    const expandedR=orb.baseR*(0.5+breathT*1.1);
    const dist=expandedR*S;
    const px=cx+Math.cos(driftAngle)*dist,py=cy+Math.sin(driftAngle)*dist;
    const bloomSize=orb.size*S*(0.55+breathT*0.85);
    const pulse=Math.sin(time*0.4+orb.pulsePhase)*0.04;
    const alpha=orb.alpha*(0.45+breathT*0.55)+pulse;
    const g=ctx.createRadialGradient(px-bloomSize*.15,py-bloomSize*.12,bloomSize*.02,px,py,bloomSize);
    g.addColorStop(0,`hsla(${orb.h},${orb.s}%,${orb.l+10}%,${Math.min(alpha,.92)})`);
    g.addColorStop(0.35,`hsla(${orb.h+8},${orb.s-5}%,${orb.l}%,${alpha*0.7})`);
    g.addColorStop(0.7,`hsla(${orb.h+15},${orb.s-10}%,${orb.l-5}%,${alpha*0.3})`);
    g.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(px,py,bloomSize,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  });
  const coreSize=S*(0.12+breathT*0.18);
  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,coreSize);
  cg.addColorStop(0,`rgba(240,235,255,${0.06+breathT*0.12})`);
  cg.addColorStop(0.5,`rgba(200,185,240,${0.03+breathT*0.06})`);
  cg.addColorStop(1,'transparent');
  ctx.beginPath();ctx.arc(cx,cy,coreSize,0,Math.PI*2);ctx.fillStyle=cg;ctx.fill();
  drawAuroraTingle(time);
}

function filPt(f,t,scale,time){
  const angle=f.baseAngle+f.jitter+Math.sin(time*.28+f.wavPhase)*.035;
  const wave=Math.sin(t*Math.PI*f.wavFreq+f.wavPhase+time*.45)*f.wavAmp*t;
  const perp=angle+Math.PI/2;
  return{x:cx+Math.cos(angle)*t*f.len*R*scale+Math.cos(perp)*wave*R*.48,
         y:cy+Math.sin(angle)*t*f.len*R*scale+Math.sin(perp)*wave*R*.48};
}

function drawBokeh(time){
  bokeh.forEach(b=>{
    const pulse=1+Math.sin(time*b.speed+b.phase)*.28;
    const bx=cx+(b.x-.5)*W*1.5,by=cy+(b.y-.5)*H*1.5,br=b.r*pulse;
    const g=ctx.createRadialGradient(bx,by,0,bx,by,br);
    g.addColorStop(0,`hsla(${b.hue},65%,88%,${b.a*1.3})`);
    g.addColorStop(.45,`hsla(${b.hue+25},55%,84%,${b.a*.45})`);
    g.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  });
}

function drawPetals(scale,time){
  petals.forEach(p=>{
    const len=p.len*R*scale,w=p.width*R*scale;
    const angle=p.angle+Math.sin(time*.14+p.phase)*.04;
    const tx=cx+Math.cos(angle)*len,ty=cy+Math.sin(angle)*len;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.bezierCurveTo(cx+Math.cos(angle-.55)*len*.7+Math.cos(angle+Math.PI/2)*w,cy+Math.sin(angle-.55)*len*.7+Math.sin(angle+Math.PI/2)*w,tx,ty,tx,ty);
    ctx.bezierCurveTo(cx+Math.cos(angle+.55)*len*.7-Math.cos(angle+Math.PI/2)*w,cy+Math.sin(angle+.55)*len*.7-Math.sin(angle+Math.PI/2)*w,cx,cy,cx,cy);
    const gr=ctx.createRadialGradient(cx,cy,0,tx*.35+cx*.65,ty*.35+cy*.65,len*.9);
    const a=.038+Math.sin(time*.28+p.phase)*.011;
    gr.addColorStop(0,`hsla(${p.hue},58%,88%,${a*1.5})`);
    gr.addColorStop(.5,`hsla(${p.hue+18},48%,84%,${a})`);
    gr.addColorStop(1,'transparent');
    ctx.fillStyle=gr;ctx.fill();
  });
}

function drawFilaments(scale,time){
  filaments.forEach(f=>{
    const pts=[];for(let i=0;i<=42;i++)pts.push(filPt(f,i/42,scale,time));
    const sh=f.hue+Math.sin(time*.55+f.wavPhase)*22;
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length-1;i++)ctx.quadraticCurveTo(pts[i].x,pts[i].y,(pts[i].x+pts[i+1].x)/2,(pts[i].y+pts[i+1].y)/2);
    ctx.strokeStyle=`hsla(${sh},52%,88%,.18)`;ctx.lineWidth=.65;ctx.stroke();
    f.orbs.forEach(orb=>{
      const p=pts[Math.min(Math.floor(orb.t*42),pts.length-1)];
      const pulse=1+Math.sin(time*1.1+orb.phase)*.1;
      const sr=orb.size*pulse*(scale*.45+.55);
      const shimmer=Math.sin(time*1.8+orb.phase)*.5+.5;
      const oh=orb.hue+shimmer*38;
      const og=ctx.createRadialGradient(p.x-sr*.3,p.y-sr*.3,sr*.04,p.x,p.y,sr);
      og.addColorStop(0,`hsla(${oh+18},88%,97%,.94)`);og.addColorStop(.22,`hsla(${oh},72%,87%,.68)`);
      og.addColorStop(.6,`hsla(${oh-18},58%,74%,.28)`);og.addColorStop(1,'transparent');
      ctx.beginPath();ctx.arc(p.x,p.y,sr,0,Math.PI*2);ctx.fillStyle=og;ctx.fill();
      ctx.strokeStyle=`hsla(${oh+28},88%,95%,${.16+shimmer*.16})`;ctx.lineWidth=.45;ctx.stroke();
      ctx.beginPath();ctx.arc(p.x-sr*.3,p.y-sr*.3,sr*.16,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${.58+shimmer*.28})`;ctx.fill();
    });
  });
}

function drawOrb(scale,time){
  const bg=ctx.createRadialGradient(cx*1.2,cy*.8,0,cx,cy,R*2.2);
  bg.addColorStop(0,'rgba(210,195,240,.06)');bg.addColorStop(.3,'rgba(140,200,220,.04)');
  bg.addColorStop(.6,'rgba(180,140,200,.03)');bg.addColorStop(1,'transparent');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  const sweep=ctx.createLinearGradient(0,H*.6,W,H);
  sweep.addColorStop(0,'rgba(140,100,200,.05)');sweep.addColorStop(.3,'rgba(100,180,220,.04)');
  sweep.addColorStop(.6,'rgba(220,160,120,.04)');sweep.addColorStop(.85,'rgba(100,200,180,.04)');
  sweep.addColorStop(1,'rgba(180,120,200,.03)');ctx.fillStyle=sweep;ctx.fillRect(0,0,W,H);
  for(let i=0;i<52;i++){
    const angle=(i/52)*Math.PI*2+time*.016;
    const len=(.44+Math.sin(i*.7+time*.1)*.14)*R*scale;
    const wav=Math.sin(i*.4+time*.18)*.06,perp=angle+Math.PI/2;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.quadraticCurveTo(cx+Math.cos(angle)*len*.5+Math.cos(perp)*wav*R,cy+Math.sin(angle)*len*.5+Math.sin(perp)*wav*R,cx+Math.cos(angle)*len+Math.cos(perp)*wav*1.5*R,cy+Math.sin(angle)*len+Math.sin(perp)*wav*1.5*R);
    ctx.strokeStyle=Math.cos(angle)>.2?'rgba(230,210,185,.11)':'rgba(190,215,230,.09)';ctx.lineWidth=.5;ctx.stroke();
  }
  pearls.forEach(p=>{
    const drift=Math.sin(time*p.speed+p.phase)*.016;
    const angle=p.angle+drift,dist=p.ring*R*scale;
    const px=cx+Math.cos(angle)*dist,py=cy+Math.sin(angle)*dist;
    const pulse=1+Math.sin(time*p.speed*1.4+p.phase)*.07;
    const sr=p.size*pulse*(scale*.35+.65);
    const pg=ctx.createRadialGradient(px-sr*.35,py-sr*.35,sr*.02,px,py,sr);
    if(p.warmTint){pg.addColorStop(0,'rgba(255,252,242,.97)');pg.addColorStop(.2,'rgba(240,228,210,.88)');pg.addColorStop(.55,'rgba(210,200,188,.52)');pg.addColorStop(.85,'rgba(190,185,178,.18)');}
    else{pg.addColorStop(0,'rgba(252,255,255,.97)');pg.addColorStop(.2,'rgba(225,235,245,.88)');pg.addColorStop(.55,'rgba(195,215,230,.48)');pg.addColorStop(.85,'rgba(175,200,220,.16)');}
    pg.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(px,py,sr,0,Math.PI*2);ctx.fillStyle=pg;ctx.fill();
    const shimmer=Math.sin(time*1.6+p.phase)*.5+.5;
    ctx.strokeStyle=`hsla(${p.hue+shimmer*45},70%,88%,${.14+shimmer*.17})`;ctx.lineWidth=.5;ctx.stroke();
    ctx.beginPath();ctx.arc(px-sr*.32,py-sr*.35,sr*.13,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${.72+shimmer*.22})`;ctx.fill();
  });
  drawOrbTingle(scale,time);
}

function drawFibers(scale,time){
  const wg=ctx.createRadialGradient(cx,cy,0,cx,cy,R*scale*1.15);
  wg.addColorStop(0,'rgba(255,198,118,.2)');wg.addColorStop(.28,'rgba(238,158,80,.11)');
  wg.addColorStop(.65,'rgba(95,128,148,.04)');wg.addColorStop(1,'transparent');
  ctx.fillStyle=wg;ctx.beginPath();ctx.arc(cx,cy,R*scale*1.5,0,Math.PI*2);ctx.fill();
  fibers.forEach(f=>{
    const sway=Math.sin(time*.2+f.wavPhase)*f.wavAmp;
    const angle=f.angle+sway,len=f.len*R*scale,perp=angle+Math.PI/2;
    ctx.beginPath();ctx.moveTo(cx,cy);
    for(let i=1;i<=24;i++){
      const t=i/24,curve=Math.sin(t*Math.PI*f.wavFreq+f.wavPhase+time*.24)*f.wavAmp*t*R*.75;
      ctx.lineTo(cx+Math.cos(angle)*t*len+Math.cos(perp)*curve,cy+Math.sin(angle)*t*len+Math.sin(perp)*curve);
    }
    const fade=Math.max(0,1-f.len*scale*.28),pulse=1+Math.sin(time*.65+f.phase)*.11;
    ctx.strokeStyle=`hsla(${f.hue},${f.sat}%,76%,${f.alpha*pulse*(fade*.38+.62)})`;ctx.lineWidth=f.width;ctx.stroke();
  });
  bokeh.slice(0,48).forEach(b=>{
    const pulse=1+Math.sin(time*b.speed+b.phase)*.42;
    const bx=cx+(b.x-.5)*W*1.25,by=cy+(b.y-.5)*H*1.25,br=b.r*.5*pulse;
    const h=b.phase*20%50+10,g=ctx.createRadialGradient(bx,by,0,bx,by,br);
    g.addColorStop(0,`hsla(${h},82%,93%,${b.a*2})`);g.addColorStop(.45,`hsla(${h+22},68%,87%,${b.a*.7})`);g.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  });
  drawFiberTingle(scale,time);
}

function drawCore(scale,time,warm){
  const cr=18*scale,pulse=1+Math.sin(time*1.7)*.07,h=warm?34:198;
  [[R*.48*scale,`hsla(${h},58%,84%,.05)`],[R*.26*scale,`hsla(${h},64%,90%,.09)`],[cr*2.8*pulse,`hsla(${h},78%,95%,.21)`]].forEach(([r,col])=>{
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,col);g.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  });
  const cg=ctx.createRadialGradient(cx-cr*.28,cy-cr*.28,1,cx,cy,cr*pulse);
  if(warm){cg.addColorStop(0,'rgba(255,244,210,.98)');cg.addColorStop(.3,'rgba(244,202,142,.87)');cg.addColorStop(.7,'rgba(198,155,92,.42)');cg.addColorStop(1,'transparent');}
  else{cg.addColorStop(0,'rgba(255,253,255,.98)');cg.addColorStop(.3,'rgba(218,233,247,.85)');cg.addColorStop(.7,'rgba(178,208,233,.42)');cg.addColorStop(1,'transparent');}
  ctx.beginPath();ctx.arc(cx,cy,cr*pulse,0,Math.PI*2);ctx.fillStyle=cg;ctx.fill();
  for(let i=0;i<6;i++){
    const ga=(i/6)*Math.PI*2+time*.45;
    const gr=(2.5+Math.random()*6)*scale;
    ctx.beginPath();ctx.arc(cx+Math.cos(ga)*gr,cy+Math.sin(ga)*gr,.6+Math.random(),0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${.45+Math.random()*.42})`;ctx.fill();
  }
}

function drawArc(){
  if(!running)return;
  const arcR=R*1.22;
  // dim track
  ctx.beginPath();ctx.arc(cx,cy,arcR,0,Math.PI*2);
  ctx.strokeStyle='rgba(200,195,220,.07)';ctx.lineWidth=1;ctx.stroke();
  // progress
  ctx.beginPath();ctx.arc(cx,cy,arcR,-Math.PI/2,-Math.PI/2+phaseProg*Math.PI*2);
  const h=currentPhaseIdx===0?192:currentPhaseIdx===2?218:205;
  ctx.strokeStyle=`hsla(${h},60%,84%,.28)`;ctx.lineWidth=1;ctx.stroke();
}

// ── LOOP ─────────────────────────────────────────────────────
function frame(now){
  requestAnimationFrame(frame);
  const rawDt=Math.min((now-lastTime)/1000,.05);
  lastTime=now;
  if(!paused)elapsed+=rawDt;

  if(running&&!paused){
    phaseProg+=rawDt/phaseTime;
    if(phaseProg>=1){phaseProg=1;startPhase(currentPhaseIdx+1);}
    countEl.textContent=Math.max(1,Math.ceil(phaseTime*(1-phaseProg)));
  }

  breathScale=getBreathScale();

  if(aesthetic!==0){
    ctx.fillStyle=aesthetic===3?'rgba(9,13,20,.9)':'rgba(7,11,20,.9)';
    ctx.fillRect(0,0,W,H);
  }

  if(aesthetic===0){
    drawAurora(breathScale,elapsed);
    if(running){
      const arcR=Math.min(W,H)*.46;
      ctx.beginPath();ctx.arc(cx,cy,arcR,0,Math.PI*2);
      ctx.strokeStyle='rgba(200,195,230,.05)';ctx.lineWidth=1;ctx.stroke();
      ctx.beginPath();ctx.arc(cx,cy,arcR,-Math.PI/2,-Math.PI/2+phaseProg*Math.PI*2);
      ctx.strokeStyle='rgba(220,210,245,.16)';ctx.lineWidth=1;ctx.stroke();
    }
  } else if(aesthetic===1){
    drawBokeh(elapsed);drawOrb(breathScale,elapsed);drawCore(breathScale,elapsed,false);drawArc();
  } else if(aesthetic===2){
    drawBokeh(elapsed);drawPetals(breathScale,elapsed);drawFilaments(breathScale,elapsed);
    drawFilamentTingle(breathScale,elapsed);drawCore(breathScale,elapsed,false);drawArc();
  } else {
    drawFibers(breathScale,elapsed);drawCore(breathScale,elapsed,true);drawArc();
  }
}
requestAnimationFrame(frame);

// ── CONTROLS ─────────────────────────────────────────────────
function toggleSub(id){
  ['sub-aesthetic','sub-timing'].forEach(s=>{
    if(s!==id)document.getElementById(s).classList.remove('open');
  });
  document.getElementById(id).classList.toggle('open');
}
document.getElementById('lbl-aesthetic').addEventListener('click',()=>toggleSub('sub-aesthetic'));
document.getElementById('lbl-timing').addEventListener('click',()=>toggleSub('sub-timing'));

document.querySelectorAll('[data-ae]').forEach(el=>{
  el.addEventListener('click',()=>{
    aesthetic=parseInt(el.dataset.ae);
    document.querySelectorAll('[data-ae]').forEach(e=>e.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('sub-aesthetic').classList.remove('open');
  });
});
document.querySelectorAll('[data-t]').forEach(el=>{
  el.addEventListener('click',()=>{
    timeSec=parseInt(el.dataset.t);
    document.querySelectorAll('[data-t]').forEach(e=>e.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('sub-timing').classList.remove('open');
  });
});
document.getElementById('lbl-sound').addEventListener('click',()=>{
  soundOn=!soundOn;
  document.getElementById('sound-state').textContent=soundOn?'on':'off';
  if(soundOn&&!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
});

// Single action button: begin → pause ↔ resume, long press = reset
let pressTimer=null;
actionBtn.addEventListener('mousedown',()=>{
  if(btnState!=='begin') pressTimer=setTimeout(()=>{resetAll();},700);
});
actionBtn.addEventListener('touchstart',()=>{
  if(btnState!=='begin') pressTimer=setTimeout(()=>{resetAll();},700);
},{passive:true});
function clearPress(){if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}}
actionBtn.addEventListener('mouseup',clearPress);
actionBtn.addEventListener('touchend',clearPress,{passive:true});

actionBtn.addEventListener('click',()=>{
  if(btnState==='begin'){
    if(soundOn&&!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    running=true;
    startPhase(0);
    setBtn('pause');
  } else if(btnState==='pause'){
    paused=true;
    setBtn('resume');
  } else if(btnState==='resume'){
    paused=false;
    setBtn('pause');
  }
});

canvas.addEventListener('click',()=>{
  document.getElementById('sub-aesthetic').classList.remove('open');
  document.getElementById('sub-timing').classList.remove('open');
});

resize();
window.addEventListener('resize',resize);
</script>
